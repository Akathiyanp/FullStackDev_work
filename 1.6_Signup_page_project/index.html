<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1f1a1a;

        }
        .card{
            border: 2px solid rgb(69, 87, 207);
            border-radius: 10px;
            padding: 50px;
            width:400px;
            
        }
        
        form{
            display: flex;
            flex-direction: column;
            
            
            
        }
        h2{
            color: #34eaea;
            text-align: center;
            font-size: x-large;
            font-weight: 800;
        }
       
        input{
            
            
            border: 2px solid rgb(160, 156, 156);
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 20px;


        }
        button{
            border: 2px solid rgb(160, 156, 156);
            padding: 10px 15px;
            border-radius: 10px;
            margin-left: 90px;
            width: 50%;
        }
       
        
           
       .first-name {
        
        margin-right: 55%;
        
        
        
        
        
       }
       .last-name{
        
        margin-top: -4.5em;  
        margin-left:55%;  
        
        
        
        flex-direction: column;
        gap:15px;
       }
        .pass{
           margin-left: 75px;
           width: 50%;
            
        }
        button{
            background-color: #3149e8;
            color:#fff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Sign Up</h2>
        <form action="">
            <input class="email" type="email" name="" id="" placeholder="Email">
            <input class="first-name" type="text" name="" id="" placeholder="First name">
            <input class="last-name" type="text" name="" id="" placeholder="Last name">
            <input class="pass" type="password" name="" id="" placeholder="Password">
            <button>Sign Up</button>
        </form>
    </div>
</body>
</html>
