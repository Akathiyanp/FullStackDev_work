<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login page</title>
    <style>
      body {
        background-color: #1a1a1a;
        /* bgc is a shorcut in vscode ide */
        margin: 0; /* for 0 margin and 0 padding - below line; bcoz some browser adds some
            margin and padding normally but we do not need here so we assign 0 for both 
            padding and margin - so now there is no more space in left hand side*/
        padding: 0;
        height: 100vh; /* 100vh for 100% view port height */
        display: flex;
        justify-content: center; /*  ctrl + enter for next line and ctrl + e, 
            ctrl + right arrow or left arrow is also helpful just try it!*/
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
      }
      .card {
        background-color: #d5d4d4;
        border-radius: 7px;
        padding: 30px;
        width: 300px;
      }
      h2 {
        color: rgb(26, 92, 214);
        text-align: center;
        margin-bottom: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      input {
        margin-bottom: 15px;
        padding: 8px;
        border-radius: 4px;
        border: 2px solid black;
        background-color: #d8d8d8;
      }
      button {
        padding: 8px;
        border-radius: 8px;
        border: 2px solid black;
        background-color: #1b81da;
        font-size: medium;
      }
      button:hover{
        background-color: rgb(17, 84, 193);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <form action="">
        <h2>Login</h2>
        <input type="email" name="" id="" placeholder="Email" />
        <input type="password" name="" id="" placeholder="Password" />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
